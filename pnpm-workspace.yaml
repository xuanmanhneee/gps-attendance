packages:
  - 'server/*'
  - 'client/*'
  - 'packages/*'

nodeLinker: hoisted

overrides:
  typescript: 5.9.3
  react: 19.1.0
  react-dom: 19.1.0
  '@types/react': ~19.1.0
  '@types/react-dom': ~19.1.0

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': true
  prisma: true
  unrs-resolver: true
