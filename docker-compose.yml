name: gps-attendance

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5430:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gps_attendance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gps_attendance"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4-alpine
    ports:
      - "6370:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    mem_limit: "${REDIS_CONTAINER_MEMORY:-640m}"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  attendance:
    build:
      context: .
      dockerfile: server/attendance/Dockerfile
    image: gps-attendance-api:local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gps_attendance
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: "${JWT_SECRET:-local-development-secret}"
      INTEGRATION_API_KEY: "${INTEGRATION_API_KEY:-demo-integration-key}"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api-docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  lms:
    build:
      context: ./server/lms
      dockerfile: Dockerfile
    image: gps-attendance-lms:local
    ports:
      - "3100:3100"
    environment:
      ATTENDANCE_INTEGRATION_URL: http://attendance:3000/v1/integration
      INTEGRATION_API_KEY: "${INTEGRATION_API_KEY:-demo-integration-key}"
      LMS_DATABASE_PATH: /data/lms.sqlite
      PORT: "3100"
    volumes:
      - lms_data:/data
    depends_on:
      attendance:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "deno", "eval", "const r=await fetch('http://127.0.0.1:3100/api/auth/me'); if(r.status!==401) Deno.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  lms_data:
