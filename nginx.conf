worker_processes auto;

events {
  worker_connections 4096;
}

http {
  upstream attendance_api {
    zone attendance_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:3000 resolve max_fails=3 fail_timeout=5s;
    keepalive 128;
  }

  server {
    listen 80 backlog=4096;

    location = /healthz {
      proxy_pass http://attendance_api/v0/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location / {
      proxy_pass http://attendance_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      add_header X-Proxy-First-Byte-Time $request_time always;
      add_header X-Upstream-Connect-Time $upstream_connect_time always;
      add_header X-Upstream-Header-Time $upstream_header_time always;
    }
  }
}
