openapi: 3.1.0
info:
  title: GPS Attendance Integration API
  version: 1.0.0
  description: |
    Hợp đồng REST giữa một GPS Attendance deployment và một hệ thống quản lý
    đào tạo. LMS gửi mã người dùng; Attendance giữ và không công bố ID nội bộ.
servers:
  - url: http://localhost:3000/v1/integration
security:
  - ApiKeyAuth: []
paths:
  /units:
    put:
      operationId: syncUnits
      summary: Upsert cây đơn vị
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/UnitInput' }
      responses:
        '200': { $ref: '#/components/responses/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    put:
      operationId: syncUsers
      summary: Upsert hồ sơ người dùng, không tạo Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200': { $ref: '#/components/responses/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /accounts:
    put:
      operationId: syncAccounts
      summary: Provision Account cho User đã đồng bộ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200': { $ref: '#/components/responses/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses:
    put:
      operationId: syncCourses
      summary: Đồng bộ học phần thành Tag của organizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courses]
              properties:
                courses:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '200': { $ref: '#/components/responses/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sessions:
    post:
      operationId: createSession
      summary: Tạo session idempotent theo externalId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /sessions/{externalId}:
    get:
      operationId: getSession
      summary: Đọc trạng thái session
      parameters:
        - $ref: '#/components/parameters/ExternalId'
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{externalId}/records:
    get:
      operationId: getSessionRecords
      summary: Đọc kết quả điểm danh
      parameters:
        - $ref: '#/components/parameters/ExternalId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Records' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{externalId}/cancel:
    post:
      operationId: cancelSession
      summary: Hủy session
      parameters:
        - $ref: '#/components/parameters/ExternalId'
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    ExternalId:
      name: externalId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
  responses:
    Unauthorized:
      description: API key không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error:
      description: Request thất bại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SyncResult:
      description: Kết quả đồng bộ
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, const: true }
              data: { $ref: '#/components/schemas/SyncResult' }
    Session:
      description: Session
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, const: true }
              data: { $ref: '#/components/schemas/Session' }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, code, message]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        message: { type: string }
    UnitInput:
      type: object
      additionalProperties: false
      required: [externalCode, name]
      properties:
        externalCode: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        parentCode: { type: [string, 'null'], maxLength: 100 }
    UserInput:
      type: object
      additionalProperties: false
      required: [code, fullname, role, unitCode]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        fullname: { type: string, minLength: 1, maxLength: 150 }
        role: { type: string, enum: [organizer, participant] }
        unitCode: { type: string, minLength: 1, maxLength: 100 }
    CourseInput:
      type: object
      required: [externalCode, name, lecturerCode, studentCodes]
      properties:
        externalCode: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        lecturerCode: { type: string, minLength: 1, maxLength: 50 }
        studentCodes:
          type: array
          minItems: 1
          items: { type: string }
    SyncResult:
      type: object
      required: [created, updated, unchanged, failed]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        failed:
          type: array
          items:
            type: object
            required: [key, code, message]
            properties:
              key: { type: string }
              code: { type: string }
              message: { type: string }
    CreateSessionInput:
      type: object
      additionalProperties: false
      required:
        [
          externalId,
          lecturerCode,
          title,
          latitude,
          longitude,
          radius,
          openAt,
          closeAt,
          studentCodes,
        ]
      properties:
        externalId: { type: string, minLength: 1, maxLength: 100 }
        lecturerCode: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radius: { type: number, exclusiveMinimum: 0 }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        studentCodes:
          type: array
          minItems: 1
          maxItems: 5000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
    Session:
      type: object
      required:
        [
          externalId,
          title,
          status,
          openAt,
          closeAt,
          participantCount,
          finalized,
        ]
      properties:
        externalId: { type: string }
        title: { type: string }
        status: { type: string, enum: [pending, open, closed, cancelled] }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        participantCount: { type: integer, minimum: 0 }
        finalized: { type: boolean }
    Records:
      type: object
      required: [externalId, finalized, records]
      properties:
        externalId: { type: string }
        finalized: { type: boolean }
        records:
          type: array
          items:
            type: object
            required: [code, fullname, status, checkedInAt]
            properties:
              code: { type: string }
              fullname: { type: string }
              status: { type: string, enum: [absent, present, late, excused] }
              checkedInAt: { type: [string, 'null'], format: date-time }
